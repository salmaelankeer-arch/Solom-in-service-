
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سولوم في الخدمة | منظم مجموعات الجرافيك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Outfit:wght@400;700;900&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
        }

        .modern-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            transition: all 0.3s ease;
        }

        .modern-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .stat-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .stat-card:hover { transform: translateY(-5px); }
        .stat-card.active {
            border: 2px solid var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .student-card {
            animation: fadeIn 0.5s ease backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="pb-24">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Header Section -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-white flex items-center gap-3">
                    <span class="bg-indigo-600 p-2 rounded-xl">🫡</span>
                    سولوم في الخدمة
                </h1>
                <p class="text-slate-400 font-bold mt-1 text-sm">نظام إدارة التدريب الذكي</p>
            </div>
            <button onclick="toggleSettings()" class="bg-white/5 p-4 rounded-2xl border border-white/10 hover:bg-white/10 transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-rotate-45 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                </svg>
            </button>
        </header>

        <!-- Main Input Container -->
        <section class="glass-card p-8 mb-8 relative overflow-hidden">
            <div class="flex items-center gap-4 mb-6">
                <span class="w-10 h-10 flex items-center justify-center bg-indigo-500 rounded-xl font-black">1</span>
                <h2 class="text-xl font-black">سجل ردود Google 📥</h2>
            </div>
            <textarea id="smartPaste" rows="3" 
                class="w-full modern-input rounded-3xl p-6 text-sm outline-none mb-4 placeholder:text-slate-500" 
                placeholder="الصقي نص الرد هنا.. سولوم هيفرز البيانات ويظبطها"></textarea>
            <button onclick="processPaste()" 
                class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-5 rounded-3xl font-black shadow-2xl shadow-indigo-500/20 hover:scale-[1.01] transition active:scale-95">
                تأكيد الإضافة في النظام
            </button>
        </section>

        <!-- Stats Dashboard -->
        <section class="grid grid-cols-2 gap-4 mb-10">
            <div onclick="setHardwareFilter('yes')" id="filter-yes" 
                class="stat-card glass-card p-6 flex flex-col items-center border-emerald-500/20">
                <span class="text-3xl font-black text-emerald-400 mb-1" id="stat-laptop-yes">0</span>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">معاهم لابتوب 💻</span>
            </div>
            <div onclick="setHardwareFilter('no')" id="filter-no" 
                class="stat-card glass-card p-6 flex flex-col items-center border-rose-500/20">
                <span class="text-3xl font-black text-rose-400 mb-1" id="stat-laptop-no">0</span>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">بدون لابتوب 📱</span>
            </div>
        </section>

        <!-- Filters & Actions -->
        <div class="flex items-center justify-between mb-6 px-2">
            <h3 class="text-lg font-black flex items-center gap-2">
                <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                قائمة الطلاب
            </h3>
            <button id="clearFiltersBtn" onclick="clearAllFilters()" class="hidden text-xs font-bold text-indigo-400 hover:text-white transition">إلغاء الفلترة</button>
        </div>

        <nav class="flex gap-2 p-2 glass-card rounded-3xl mb-8 border-white/5">
            <button onclick="setTab('all')" id="tab-all" class="tab-btn active flex-1 py-4 rounded-2xl text-xs font-black">الكل (<span id="count-all">0</span>)</button>
            <button onclick="setTab('now')" id="tab-now" class="tab-btn flex-1 py-4 rounded-2xl text-xs font-black">المجموعة الحالية (<span id="count-now">0</span>)</button>
            <button onclick="setTab('later')" id="tab-later" class="tab-btn flex-1 py-4 rounded-2xl text-xs font-black">في الإجازة (<span id="count-later">0</span>)</button>
        </nav>

        <!-- Action Bar -->
        <div id="multiSendBox" class="hidden mb-8">
            <button onclick="sendGroupLink()" 
                class="w-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-6 rounded-[2rem] font-black flex items-center justify-center gap-4 hover:bg-emerald-500 hover:text-white transition group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
                إرسال لينك الجروب لطلاب هذه القائمة
            </button>
        </div>

        <!-- Cards Container -->
        <div id="studentsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div id="emptyState" class="hidden glass-card py-20 text-center">
            <p class="text-slate-500 font-bold italic">مفيش بيانات هنا يا هندسة</p>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl z-50 hidden flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-lg p-10 border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black">إعدادات سولوم ⚙️</h2>
                <button onclick="toggleSettings()" class="text-slate-500 hover:text-white transition">✕</button>
            </div>
            
            <div class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-indigo-400 mb-3 uppercase tracking-widest">رابط جروب الواتساب الرسمي</label>
                    <input type="text" id="groupLink" class="w-full modern-input p-5 rounded-2xl text-sm outline-none" placeholder="https://chat.whatsapp.com/...">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-400 mb-3 uppercase tracking-widest">رسالة الترحيب التلقائية</label>
                    <textarea id="msgTemplate" rows="4" class="w-full modern-input p-5 rounded-2xl text-sm outline-none" 
                        placeholder="استخدمي {name} للاسم و {link} للرابط"></textarea>
                </div>
                <div class="pt-4 space-y-4">
                    <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl hover:bg-indigo-700 transition">حفظ التغييرات</button>
                    <button onclick="clearAllData()" class="w-full text-rose-400 text-xs font-bold opacity-50 hover:opacity-100 transition">تصفير كافة بيانات الطلاب</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'soloum-system-v1';

        let students = [];
        let currentTab = 'all';
        let hardwareFilter = 'all';
        let user = null;

        let settings = JSON.parse(localStorage.getItem('soloum_settings')) || {
            groupLink: '',
            messageTemplate: 'يا هلا بيك يا {name}! مبروك قبولك معانا في التدريب 🎨 دا لينك الجروب الخاص بيك عشان تتابع التفاصيل: {link}'
        };

        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
        }

        auth.onAuthStateChanged((u) => {
            user = u;
            if (user) bindData();
        });

        function bindData() {
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('students')
                .onSnapshot((snapshot) => {
                    students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                });
        }

        window.setTab = (t) => {
            currentTab = t;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            updateMultiSendVisibility();
            render();
        };

        window.setHardwareFilter = (val) => {
            hardwareFilter = (hardwareFilter === val) ? 'all' : val;
            document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
            if (hardwareFilter !== 'all') {
                document.getElementById('filter-' + hardwareFilter).classList.add('active');
                document.getElementById('clearFiltersBtn').classList.remove('hidden');
            } else {
                document.getElementById('clearFiltersBtn').classList.add('hidden');
            }
            render();
        };

        window.clearAllFilters = () => {
            hardwareFilter = 'all';
            document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
            document.getElementById('clearFiltersBtn').classList.add('hidden');
            render();
        };

        function updateMultiSendVisibility() {
            const multiSendBox = document.getElementById('multiSendBox');
            multiSendBox.style.display = (currentTab === 'now' || currentTab === 'later') ? 'block' : 'none';
        }

        window.processPaste = async () => {
            const raw = document.getElementById('smartPaste').value;
            if (!raw.trim()) return;

            try {
                // Enhanced Extraction Logic
                const nameMatch = raw.match(/الاسم؟\s*(?:\*)?\s*([\s\S]*?)\s*(?:الكلية|رقم|$)/i);
                const phoneMatch = raw.match(/رقم التليفون\s*\(?\s*واتساب\s*\)?\s*(?:\*)?\s*([\s\S]*?)\s*(?:هل|$)/i);
                const laptopMatch = raw.match(/جهاز لابتوب؟\s*(?:\*)?\s*(نعم|لا)/i);
                const altMatch = raw.match(/استخدام بديل\s*(?:\*)?\s*([\s\S]*?)\s*(?:هل|$)/i);

                const name = nameMatch ? nameMatch[1].trim().split('\n')[0] : "متدرب مجهول";
                let phone = phoneMatch ? phoneMatch[1].trim().replace(/\D/g, '') : "";
                if (phone.startsWith('0')) phone = '2' + phone;
                if (phone.length === 11) phone = '2' + phone;

                const hasLaptop = laptopMatch ? (laptopMatch[1].trim() === "نعم") : false;
                const alternative = altMatch ? altMatch[1].trim() : "";

                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('students').add({
                    name, phone, hasLaptop, alternative,
                    timing: '', sent: false, createdAt: Date.now()
                });

                document.getElementById('smartPaste').value = '';
            } catch (e) { alert("تأكدي من صحة نص الرد يا هندسة"); }
        };

        window.render = () => {
            const container = document.getElementById('studentsContainer');
            const empty = document.getElementById('emptyState');
            container.innerHTML = '';

            const filtered = students.filter(s => {
                let tabMatch = (currentTab === 'all' || s.timing === currentTab);
                let hwMatch = (hardwareFilter === 'all' || (hardwareFilter === 'yes' ? s.hasLaptop : !s.hasLaptop));
                return tabMatch && hwMatch;
            }).sort((a, b) => b.createdAt - a.createdAt);

            document.getElementById('count-all').innerText = students.length;
            document.getElementById('count-now').innerText = students.filter(s => s.timing === 'now').length;
            document.getElementById('count-later').innerText = students.filter(s => s.timing === 'later').length;
            
            document.getElementById('stat-laptop-yes').innerText = students.filter(s => s.hasLaptop).length;
            document.getElementById('stat-laptop-no').innerText = students.filter(s => !s.hasLaptop).length;

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                filtered.forEach(s => {
                    const card = document.createElement('div');
                    card.className = "student-card glass-card p-6 flex flex-col justify-between border-white/5";
                    card.innerHTML = `
                        <div class="mb-4">
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="font-black text-white text-lg">${s.name}</h3>
                                ${s.sent ? '<span class="text-[8px] bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-black">وصلت 🫡</span>' : ''}
                            </div>
                            
                            <div class="space-y-4 mb-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-lg ${s.hasLaptop ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center">
                                        ${s.hasLaptop ? '💻' : '📱'}
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-[10px] text-slate-500 font-black uppercase">الجهاز المستخدم</p>
                                        <p class="text-xs font-bold">${s.hasLaptop ? 'لابتوب متوفر' : 'غير متوفر'}</p>
                                    </div>
                                </div>

                                ${!s.hasLaptop ? `
                                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                                        <label class="text-[9px] font-black text-indigo-400 block mb-2">البديل المتاح:</label>
                                        <input type="text" value="${s.alternative || ''}" 
                                            onchange="updateField('${s.id}', 'alternative', this.value)"
                                            placeholder="موبايل؟ تابلت؟"
                                            class="w-full bg-transparent border-b border-white/10 text-xs outline-none focus:border-indigo-500 pb-1">
                                    </div>
                                ` : ''}
                            </div>

                            <select onchange="updateField('${s.id}', 'timing', this.value)" 
                                class="w-full text-xs font-black bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500">
                                <option value="" class="bg-slate-900" ${!s.timing ? 'selected' : ''}>📍 تحديد موعد التدريب</option>
                                <option value="now" class="bg-slate-900" ${s.timing === 'now' ? 'selected' : ''}>المجموعة الحالية</option>
                                <option value="later" class="bg-slate-900" ${s.timing === 'later' ? 'selected' : ''}>في الإجازة</option>
                            </select>
                        </div>

                        <div class="flex gap-2 pt-4 border-t border-white/5">
                            <button onclick="sendWhatsApp('${s.id}', '${s.phone}', '${s.name}')" 
                                class="flex-1 bg-white/10 hover:bg-white/20 py-4 rounded-2xl text-xs font-black transition">
                                إرسال واتساب
                            </button>
                            <button onclick="deleteStudent('${s.id}')" 
                                class="bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white px-5 rounded-2xl transition">
                                ✕
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        };

        window.updateField = async (id, field, value) => {
            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('students').doc(id).update({ [field]: value });
        };

        window.sendWhatsApp = (id, phone, name) => {
            const message = settings.messageTemplate.replace(/{name}/g, name).replace(/{link}/g, settings.groupLink);
            window.updateField(id, 'sent', true);
            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`, '_blank');
        };

        window.sendGroupLink = () => {
            const list = students.filter(s => {
                let tabMatch = (currentTab === 'all' || s.timing === currentTab);
                let hwMatch = (hardwareFilter === 'all' || (hardwareFilter === 'yes' ? s.hasLaptop : !s.hasLaptop));
                return tabMatch && hwMatch;
            });
            if (list.length === 0) return;
            if (confirm(`سولوم هيرسل اللينك لـ ${list.length} طالب، نبدأ؟`)) {
                list.forEach((s, index) => {
                    setTimeout(() => window.sendWhatsApp(s.id, s.phone, s.name), index * 3000);
                });
            }
        };

        window.toggleSettings = () => {
            document.getElementById('settingsModal').classList.toggle('hidden');
            document.getElementById('groupLink').value = settings.groupLink;
            document.getElementById('msgTemplate').value = settings.messageTemplate;
        };

        window.saveSettings = () => {
            settings.groupLink = document.getElementById('groupLink').value;
            settings.messageTemplate = document.getElementById('msgTemplate').value;
            localStorage.setItem('soloum_settings', JSON.stringify(settings));
            toggleSettings();
        };

        window.deleteStudent = async (id) => {
            if (confirm("حذف الطالب من النظام؟")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('students').doc(id).delete();
        };

        window.clearAllData = async () => {
            if (confirm("تصفير النظام بالكامل؟ (لا يمكن التراجع)")) {
                const batch = db.batch();
                students.forEach(s => batch.delete(db.collection('artifacts').doc(appId).collection('public').doc('data').collection('students').doc(s.id)));
                await batch.commit();
            }
        };

        initAuth();
    </script>
</body>
</html>

```
