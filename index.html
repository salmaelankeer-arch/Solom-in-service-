
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سولوم في الخدمة | Cloud 🫡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root { --primary: #6366f1; --glass-border: rgba(255, 255, 255, 0.08); }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 2rem; }
        .modern-input { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: white; transition: all 0.3s ease; }
        .modern-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }
        .tab-btn.active { background: var(--primary); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        .paid-badge { background: #10b981; color: white; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: bold; }
        .search-bar { position: sticky; top: 10px; z-index: 40; }
        .btn-welcome { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .count-badge { background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 6px; margin-right: 4px; font-size: 9px; }
    </style>
</head>
<body class="pb-24 px-4">

    <div class="max-w-4xl mx-auto pt-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-white flex items-center gap-2">
                    <span class="bg-indigo-600 p-2 rounded-xl text-xl">🫡</span> سولوم في الخدمة
                </h1>
                <p class="text-slate-400 font-bold mt-1 text-[10px]" id="syncStatus">جاري المزامنة... ⏳</p>
            </div>
            <button onclick="toggleSettings()" class="bg-white/5 p-3 rounded-2xl border border-white/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>
            </button>
        </header>

        <!-- Search -->
        <div class="search-bar mb-6">
            <div class="glass-card flex items-center px-4 py-2 shadow-2xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <input type="text" id="searchInput" oninput="renderStudents()" placeholder="ابحثي بالاسم أو الرقم..." class="bg-transparent border-none w-full p-2 text-sm outline-none text-white placeholder:text-slate-500">
            </div>
        </div>

        <!-- Input Box -->
        <section class="glass-card p-6 mb-8 border-dashed border-indigo-500/30">
            <textarea id="smartPaste" rows="2" class="w-full modern-input rounded-2xl p-4 text-xs outline-none mb-3 placeholder:text-slate-500" placeholder="الصقي استجابة الطالب هنا..."></textarea>
            <button onclick="processPaste()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-black transition text-sm">تأكيد الإضافة للسحاب 📥</button>
        </section>

        <!-- Stats -->
        <section class="grid grid-cols-2 gap-4 mb-8">
            <div onclick="setHardwareFilter('yes')" id="filter-yes" class="glass-card p-4 flex flex-col items-center cursor-pointer hover:bg-indigo-500/10 transition border-transparent border-2">
                <span class="text-2xl font-black text-emerald-400" id="stat-laptop-yes">0</span>
                <span class="text-[10px] font-black text-slate-400">لابتوب ✅</span>
            </div>
            <div onclick="setHardwareFilter('no')" id="filter-no" class="glass-card p-4 flex flex-col items-center cursor-pointer hover:bg-rose-500/10 transition border-transparent border-2">
                <span class="text-2xl font-black text-rose-400" id="stat-laptop-no">0</span>
                <span class="text-[10px] font-black text-slate-400">بدون / بديل 📱</span>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <nav class="flex gap-2 p-1.5 glass-card rounded-2xl mb-8">
            <button onclick="setTab('all')" id="tab-all" class="tab-btn active flex-1 py-3 rounded-xl text-[10px] font-black">
                الكل <span id="count-all" class="count-badge">0</span>
            </button>
            <button onclick="setTab('soon')" id="tab-soon" class="tab-btn flex-1 py-3 rounded-xl text-[10px] font-black">
                القريبة <span id="count-soon" class="count-badge">0</span>
            </button>
            <button onclick="setTab('vacation')" id="tab-vacation" class="tab-btn flex-1 py-3 rounded-xl text-[10px] font-black">
                الإجازة <span id="count-vacation" class="count-badge">0</span>
            </button>
        </nav>

        <!-- List -->
        <div id="studentsContainer" class="space-y-4"></div>
        <div id="emptyState" class="hidden glass-card py-20 text-center text-slate-500 font-bold italic">لا توجد بيانات تطابق البحث</div>
    </div>

    <!-- Modal for Alternative Hardware -->
    <div id="altModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-6">
        <div class="glass-card w-full max-sm p-6 border-white/10 shadow-2xl">
            <h2 class="text-lg font-black mb-4">تعديل بيانات الجهاز 📱</h2>
            <input type="text" id="altInput" class="w-full modern-input p-4 rounded-xl text-sm outline-none mb-4" placeholder="الجهاز البديل...">
            <div class="flex gap-2">
                <button onclick="saveAltHardware()" class="flex-1 bg-indigo-600 text-white font-black py-3 rounded-xl">حفظ</button>
                <button onclick="closeAltModal()" class="flex-1 bg-white/10 text-white py-3 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-md p-8 border-white/10 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-black mb-6">الإعدادات ⚙️</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">رابط المجموعة القريبة</label>
                    <input type="text" id="groupLinkSoon" class="w-full modern-input p-3 rounded-xl text-sm outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">رابط مجموعة الإجازة</label>
                    <input type="text" id="groupLinkVacation" class="w-full modern-input p-3 rounded-xl text-sm outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">رسالة الترحيب ({name})</label>
                    <textarea id="welcomeTemplate" rows="4" class="w-full modern-input p-3 rounded-xl text-sm outline-none"></textarea>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">رسالة اللينك ({name} و {link})</label>
                    <textarea id="linkTemplate" rows="3" class="w-full modern-input p-3 rounded-xl text-sm outline-none"></textarea>
                </div>
                <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl">حفظ التغييرات</button>
                <button onclick="toggleSettings()" class="w-full text-slate-400 text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC3GQccPFLVHFi8aVmJ3lmeC8UHRT_tNwQ",
            authDomain: "solom-feecf.firebaseapp.com",
            databaseURL: "https://solom-feecf-default-rtdb.firebaseio.com",
            projectId: "solom-feecf",
            storageBucket: "solom-feecf.firebasestorage.app",
            messagingSenderId: "516763285608",
            appId: "1:516763285608:web:ee218fd56f6d56775863dd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const studentsRef = db.ref('students');
        const settingsRef = db.ref('settings');

        let students = [];
        let currentTab = 'all';
        let hardwareFilter = 'all';
        let editingAltId = null;
        let appSettings = {
            groupLinkSoon: '',
            groupLinkVacation: '',
            welcomeTemplate: 'أهلاً بك يا {name}، مبسوط بانضمامك للتدريب ان شاء الله تخرج منه وانت معاك المهارة بشكل كويس ومواكب لسوق العمل.. التدريب هيكون عباره عن مجموعتين (قريبة وإجازة)، شوف الانسب واكد معايا الحجز.',
            linkTemplate: 'أهلاً يا {name}، ده لينك مجموعتك: {link}'
        };

        settingsRef.on('value', snapshot => {
            if (snapshot.val()) appSettings = { ...appSettings, ...snapshot.val() };
            document.getElementById('groupLinkSoon').value = appSettings.groupLinkSoon;
            document.getElementById('groupLinkVacation').value = appSettings.groupLinkVacation;
            document.getElementById('welcomeTemplate').value = appSettings.welcomeTemplate;
            document.getElementById('linkTemplate').value = appSettings.linkTemplate;
        });

        studentsRef.on('value', snapshot => {
            const data = snapshot.val();
            students = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            document.getElementById('syncStatus').innerText = 'متصل سحابياً ⚡';
            renderStudents();
        });

        function processPaste() {
            const text = document.getElementById('smartPaste').value.trim();
            if (!text) return;
            const lines = text.split('\n');
            const name = lines[0].trim();
            const phoneLine = lines.find(l => l.match(/01[0125]\d{8}/));
            const phone = phoneLine ? phoneLine.match(/01[0125]\d{8}/)[0] : 'غير مسجل';
            const hasLaptop = text.includes('لدي لابتوب') || text.toLowerCase().includes('yes') || text.includes('نعم');
            
            let group = 'unassigned'; 
            if (text.includes('إجازة') || text.includes('اجازه')) group = 'vacation';
            else if (text.includes('قريبة') || text.includes('قريبه')) group = 'soon';

            const newStudent = {
                name,
                phone: phone.replace(/\s/g, ''),
                hasLaptop,
                altHardware: hasLaptop ? '' : 'لم يحدد',
                group,
                paid: false,
                timestamp: Date.now()
            };

            studentsRef.push(newStudent);
            document.getElementById('smartPaste').value = '';
        }

        function renderStudents() {
            const container = document.getElementById('studentsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            // Update Tab Counts
            document.getElementById('count-all').innerText = students.length;
            document.getElementById('count-soon').innerText = students.filter(s => s.group === 'soon').length;
            document.getElementById('count-vacation').innerText = students.filter(s => s.group === 'vacation').length;
            document.getElementById('stat-laptop-yes').innerText = students.filter(s => s.hasLaptop).length;
            document.getElementById('stat-laptop-no').innerText = students.filter(s => !s.hasLaptop).length;

            let filtered = students.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(search) || s.phone.includes(search);
                const matchTab = currentTab === 'all' || s.group === currentTab;
                const matchHardware = hardwareFilter === 'all' || 
                    (hardwareFilter === 'yes' && s.hasLaptop) || 
                    (hardwareFilter === 'no' && !s.hasLaptop);
                return matchSearch && matchTab && matchHardware;
            });

            container.innerHTML = '';
            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);

            filtered.sort((a,b) => b.timestamp - a.timestamp).forEach(s => {
                const div = document.createElement('div');
                div.className = `glass-card p-5 student-card border-r-4 ${s.paid ? 'border-emerald-500' : 'border-indigo-500'}`;
                
                const showWelcome = (currentTab === 'all');
                const showPayBtn = (currentTab !== 'all');
                
                let groupLabel = "لم يحدد بعد";
                if(s.group === 'soon') groupLabel = "المجموعة القريبة";
                if(s.group === 'vacation') groupLabel = "مجموعة الإجازة";

                div.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-white flex items-center gap-2 text-sm">
                                ${s.name} 
                                ${s.paid ? '<span class="paid-badge">تم الدفع ✓</span>' : ''}
                            </h3>
                            <div class="flex items-center gap-2 mt-1">
                                <p class="text-[10px] text-slate-400">${s.phone}</p>
                                <span class="text-[9px] px-2 py-0.5 rounded bg-white/5 text-slate-300 border border-white/5 cursor-pointer" onclick="changeStudentGroup('${s.id}')">
                                    📍 ${groupLabel}
                                </span>
                            </div>
                        </div>
                        <button onclick="deleteStudent('${s.id}')" class="opacity-20 hover:opacity-100 text-rose-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                    
                    <div class="bg-white/5 rounded-lg p-2 text-[10px] border border-white/5 mb-4 flex justify-between items-center">
                        <div>
                            <span class="text-slate-500">الجهاز:</span>
                            <span class="text-slate-200">
                                ${s.hasLaptop ? '💻 لابتوب' : `📱 بديل: <span class="text-rose-400 cursor-pointer underline" onclick="openAltModal('${s.id}', '${s.altHardware}')">${s.altHardware || 'اضغطي لتحدد'}</span>`}
                            </span>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        ${showWelcome ? `
                            <button onclick="sendWelcome('${s.id}')" class="btn-welcome flex-1 py-2.5 rounded-xl text-[10px] font-bold">
                                ترحيب 👋
                            </button>
                        ` : ''}
                        
                        ${showPayBtn ? `
                            <button onclick="confirmPayment('${s.id}', ${s.paid})" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold transition ${s.paid ? 'bg-slate-700 text-slate-400' : 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30'}">
                                ${s.paid ? 'إلغاء دفع' : 'تم الدفع 💰'}
                            </button>
                        ` : ''}

                        <button onclick="sendGroupLink('${s.id}')" class="flex-1 py-2.5 rounded-xl text-[10px] font-bold bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
                            اللينك 🔗
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function changeStudentGroup(id) {
            const current = students.find(x => x.id === id).group;
            let next = 'soon';
            if(current === 'soon') next = 'vacation';
            if(current === 'vacation') next = 'unassigned';
            
            studentsRef.child(id).update({ group: next });
        }

        function sendWelcome(id) {
            const s = students.find(x => x.id === id);
            const message = appSettings.welcomeTemplate.replace('{name}', s.name);
            window.open(`https://wa.me/2${s.phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function sendGroupLink(id) {
            const s = students.find(x => x.id === id);
            if(s.group === 'unassigned') {
                alert("برجاء تحديد مجموعة للطالب أولاً (بالضغط على كلمة لم يحدد)");
                return;
            }
            const link = s.group === 'soon' ? appSettings.groupLinkSoon : appSettings.groupLinkVacation;
            const message = appSettings.linkTemplate.replace('{name}', s.name).replace('{link}', link);
            window.open(`https://wa.me/2${s.phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function confirmPayment(id, currentStatus) {
            if (!currentStatus) {
                if (confirm("تأكيد حجز الطالب وتفعيل علامة الدفع؟")) {
                    studentsRef.child(id).update({ paid: true });
                }
            } else {
                studentsRef.child(id).update({ paid: false });
            }
        }

        function deleteStudent(id) {
            if (confirm("حذف الطالب نهائياً؟")) studentsRef.child(id).remove();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            renderStudents();
        }

        function setHardwareFilter(type) {
            hardwareFilter = (hardwareFilter === type) ? 'all' : type;
            document.getElementById('filter-yes').classList.toggle('border-indigo-500', hardwareFilter === 'yes');
            document.getElementById('filter-no').classList.toggle('border-rose-500', hardwareFilter === 'no');
            renderStudents();
        }

        function openAltModal(id, currentVal) {
            editingAltId = id;
            document.getElementById('altInput').value = currentVal === 'لم يحدد' ? '' : currentVal;
            document.getElementById('altModal').classList.remove('hidden');
        }

        function closeAltModal() { document.getElementById('altModal').classList.add('hidden'); }

        function saveAltHardware() {
            const val = document.getElementById('altInput').value.trim();
            if (editingAltId) studentsRef.child(editingAltId).update({ altHardware: val || 'لم يحدد' });
            closeAltModal();
        }

        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }

        function saveSettings() {
            const newSettings = {
                groupLinkSoon: document.getElementById('groupLinkSoon').value,
                groupLinkVacation: document.getElementById('groupLinkVacation').value,
                welcomeTemplate: document.getElementById('welcomeTemplate').value,
                linkTemplate: document.getElementById('linkTemplate').value
            };
            settingsRef.set(newSettings);
            toggleSettings();
        }
    </script>
</body>
</html>
